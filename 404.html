<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Saad Benhaimer</title>
<meta name="robots" content="noindex">
<script>
(function () {
  try {
    var s = localStorage.getItem('sb-theme');
    var t = (s === 'light' || s === 'dark') ? s
      : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500&amp;family=Caveat:wght@500&amp;display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .nf { min-height: 100vh; display: grid; place-content: center; text-align: left; }
  .nf-code { font-family: var(--serif); font-size: clamp(90px, 18vw, 200px); line-height: .9; letter-spacing: -.03em; }
  .nf-note { margin-top: 8px; font-size: 28px; transform: rotate(-2deg); transform-origin: left; }
  .nf-back { margin-top: 32px; }
</style>
</head>
<body>
<main class="nf shell">
  <p class="nf-code">404</p>
  <p class="hand nf-note">cette page n'existe pas (encore)</p>
  <p class="muted" style="margin-top:20px;max-width:34em">La page que vous cherchez a changé d'adresse ou n'a jamais existé.</p>
  <p class="nf-back"><a class="btn btn-primary" href="/">Retour au portfolio</a></p>
</main>
</body>
</html>
